---

- name: Deploy Project 07 Agustus
  hosts: production
  become: true
  gather_facts: false

  vars:
    project_dir: /var/www/html/project_07_agustus
    laravel_container: project07-laravel
    mysql_container: project07-mysql

  tasks:

    # ==========================================
    # 1. CHECK CONNECTION
    # ==========================================

    - name: Check VPS connection
      ansible.builtin.ping:

    # ==========================================
    # 2. CHECK DOCKER
    # ==========================================

    - name: Check Docker version
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Show Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    # ==========================================
    # 3. CHECK PROJECT DIRECTORY
    # ==========================================

    - name: Check project directory
      ansible.builtin.stat:
        path: "{{ project_dir }}"
      register: project_directory

    - name: Stop if project directory does not exist
      ansible.builtin.fail:
        msg: "Project directory tidak ditemukan: {{ project_dir }}"
      when: not project_directory.stat.exists

    # ==========================================
    # 4. UPDATE SOURCE CODE
    # ==========================================

    - name: Fetch latest source code
      ansible.builtin.command:
        cmd: git fetch origin
        chdir: "{{ project_dir }}"

    - name: Reset source code to origin/main
      ansible.builtin.command:
        cmd: git reset --hard origin/main
        chdir: "{{ project_dir }}"

    # ==========================================
    # 5. DOCKER COMPOSE BUILD
    # ==========================================

    - name: Stop existing containers
      ansible.builtin.command:
        cmd: docker compose down --remove-orphans
        chdir: "{{ project_dir }}"

    - name: Build and start containers
      ansible.builtin.command:
        cmd: docker compose up -d --build
        chdir: "{{ project_dir }}"

    # ==========================================
    # 6. WAIT FOR MYSQL
    # ==========================================

    - name: Wait for MySQL container
      ansible.builtin.command:
        cmd: docker exec {{ mysql_container }} mysqladmin ping -h localhost
      register: mysql_status
      retries: 30
      delay: 5
      until: mysql_status.rc == 0
      changed_when: false

    # ==========================================
    # 7. CHECK CONTAINERS
    # ==========================================

    - name: Show running containers
      ansible.builtin.command:
        cmd: docker ps
      register: docker_ps
      changed_when: false

    - name: Display running containers
      ansible.builtin.debug:
        var: docker_ps.stdout_lines

    # ==========================================
    # 8. COMPOSER INSTALL
    # ==========================================

    - name: Install Composer dependencies
      ansible.builtin.command:
        cmd: >
          docker exec {{ laravel_container }}
          composer install
          --working-dir=/var/www/html
          --no-interaction
          --prefer-dist
          --optimize-autoloader
      register: composer_result

    # ==========================================
    # 9. LARAVEL PERMISSIONS
    # ==========================================

    - name: Set Laravel storage permissions
      ansible.builtin.command:
        cmd: >
          docker exec {{ laravel_container }}
          chown -R www-data:www-data
          /var/www/html/storage
          /var/www/html/bootstrap/cache

    # ==========================================
    # 10. CLEAR CONFIGURATION
    # ==========================================

    - name: Clear Laravel configuration
      ansible.builtin.command:
        cmd: >
          docker exec {{ laravel_container }}
          php /var/www/html/artisan config:clear

    # ==========================================
    # 11. DATABASE MIGRATION
    # ==========================================

    - name: Run Laravel migration
      ansible.builtin.command:
        cmd: >
          docker exec {{ laravel_container }}
          php /var/www/html/artisan migrate --force

    # ==========================================
    # 12. CACHE CONFIGURATION
    # ==========================================

    - name: Cache Laravel configuration
      ansible.builtin.command:
        cmd: >
          docker exec {{ laravel_container }}
          php /var/www/html/artisan config:cache

    # ==========================================
    # 13. LARAVEL VERSION
    # ==========================================

    - name: Check Laravel version
      ansible.builtin.command:
        cmd: >
          docker exec {{ laravel_container }}
          php /var/www/html/artisan --version
      register: laravel_version
      changed_when: false

    - name: Display Laravel version
      ansible.builtin.debug:
        var: laravel_version.stdout

    # ==========================================
    # 14. MIGRATION STATUS
    # ==========================================

    - name: Check migration status
      ansible.builtin.command:
        cmd: >
          docker exec {{ laravel_container }}
          php /var/www/html/artisan migrate:status
      register: migration_status
      changed_when: false

    - name: Display migration status
      ansible.builtin.debug:
        var: migration_status.stdout_lines

    # ==========================================
    # 15. FINAL CONTAINER CHECK
    # ==========================================

    - name: Final Docker container check
      ansible.builtin.command:
        cmd: docker ps
      register: final_docker_ps
      changed_when: false

    - name: Display final Docker status
      ansible.builtin.debug:
        var: final_docker_ps.stdout_lines